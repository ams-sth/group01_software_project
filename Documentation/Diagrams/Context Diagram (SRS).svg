<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SplitSync context diagram</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">SplitSync – Context Diagram</text>

  <!-- User actor -->
  <circle cx="110" cy="235" r="20" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <path d="M110,255 L110,300 M78,273 L142,273 M110,300 L86,345 M110,300 L134,345" stroke="#b45309" stroke-width="2" fill="none"/>
  <text x="110" y="372" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">User</text>
  <text x="110" y="390" text-anchor="middle" font-size="12" fill="#6b7280">Group member</text>
  <text x="110" y="406" text-anchor="middle" font-size="12" fill="#6b7280">(group creator can also</text>
  <text x="110" y="422" text-anchor="middle" font-size="12" fill="#6b7280">manage the group)</text>

  <!-- System -->
  <rect x="380" y="190" width="240" height="170" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <text x="500" y="236" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a8a">SplitSync</text>
  <text x="500" y="262" text-anchor="middle" font-size="13" fill="#1e3a8a">Group expense-splitting</text>
  <text x="500" y="280" text-anchor="middle" font-size="13" fill="#1e3a8a">Progressive Web App</text>
  <text x="500" y="312" text-anchor="middle" font-size="11" fill="#475569">Groups · Expenses · Splits · Receipts</text>
  <text x="500" y="328" text-anchor="middle" font-size="11" fill="#475569">Balances · Settlements · Recurring</text>
  <text x="500" y="344" text-anchor="middle" font-size="11" fill="#475569">Activity log · Reminders</text>

  <!-- Kinde IdP -->
  <rect x="740" y="110" width="220" height="100" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
  <text x="850" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#701a75">Identity Provider (Kinde)</text>
  <text x="850" y="164" text-anchor="middle" font-size="12" fill="#701a75">Email/password and</text>
  <text x="850" y="180" text-anchor="middle" font-size="12" fill="#701a75">Google sign-in</text>
  <text x="850" y="198" text-anchor="middle" font-size="11" fill="#6b7280">External system</text>

  <!-- Email service -->
  <rect x="740" y="340" width="220" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="850" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Email Delivery Service</text>
  <text x="850" y="394" text-anchor="middle" font-size="12" fill="#14532d">Third-party email provider</text>
  <text x="850" y="428" text-anchor="middle" font-size="11" fill="#6b7280">External system</text>

  <!-- User <-> System -->
  <line x1="150" y1="285" x2="378" y2="285" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="264" y="226" text-anchor="middle" font-size="11" fill="#374151">Create/manage groups, add/edit</text>
  <text x="264" y="241" text-anchor="middle" font-size="11" fill="#374151">expenses and recurring expenses,</text>
  <text x="264" y="256" text-anchor="middle" font-size="11" fill="#374151">attach receipts, record settlements,</text>
  <text x="264" y="271" text-anchor="middle" font-size="11" fill="#374151">set reminder preference</text>
  <line x1="378" y1="320" x2="150" y2="320" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="264" y="338" text-anchor="middle" font-size="11" fill="#374151">Balances, expense history,</text>
  <text x="264" y="353" text-anchor="middle" font-size="11" fill="#374151">activity log, validation feedback</text>

  <!-- System <-> IdP -->
  <line x1="600" y1="215" x2="738" y2="165" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="738" y1="185" x2="600" y2="235" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="640" y="152" text-anchor="middle" font-size="11" fill="#374151">Sign-in request</text>
  <text x="700" y="238" text-anchor="middle" font-size="11" fill="#374151">Verified identity</text>
  <text x="700" y="252" text-anchor="middle" font-size="11" fill="#374151">(incl. email)</text>

  <!-- System -> Email -->
  <line x1="600" y1="335" x2="738" y2="375" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="650" y="372" text-anchor="middle" font-size="11" fill="#374151">Daily unpaid-balance</text>
  <text x="650" y="387" text-anchor="middle" font-size="11" fill="#374151">reminder emails</text>

  <!-- Email -> User (dashed) -->
  <path d="M850,442 L850,500 L110,500 L110,432" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/>
  <text x="480" y="520" text-anchor="middle" font-size="11" fill="#374151">Reminder email delivered to the user's registered address</text>

  <!-- Legend -->
  <rect x="380" y="410" width="240" height="60" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="394" y="430" font-size="11" font-weight="700" fill="#374151">Legend</text>
  <line x1="394" y1="445" x2="430" y2="445" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="438" y="449" font-size="11" fill="#374151">Data flow</text>
  <line x1="394" y1="460" x2="430" y2="460" stroke="#374151" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="438" y="464" font-size="11" fill="#374151">Delivered outside the system</text>
</svg>
