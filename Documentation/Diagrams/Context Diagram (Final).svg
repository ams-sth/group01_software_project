<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SplitSync system context diagram</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">SplitSync – System Context Diagram</text>

  <!-- Actor -->
  <circle cx="90" cy="285" r="18" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <path d="M90,303 L90,345 M60,320 L120,320 M90,345 L68,385 M90,345 L112,385" stroke="#b45309" stroke-width="2" fill="none"/>
  <text x="90" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">User</text>
  <text x="90" y="428" text-anchor="middle" font-size="12" fill="#6b7280">Roommate / group member</text>
  <text x="90" y="444" text-anchor="middle" font-size="12" fill="#6b7280">(web browser)</text>

  <!-- System boundary -->
  <rect x="220" y="80" width="750" height="500" rx="14" fill="#f9fafb" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="240" y="104" font-size="14" font-weight="700" fill="#374151">SplitSync system</text>

  <!-- Frontend -->
  <rect x="250" y="190" width="200" height="190" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="350" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Frontend</text>
  <text x="350" y="236" text-anchor="middle" font-size="12" fill="#1e3a8a">React 19 + TypeScript + Vite</text>
  <text x="350" y="252" text-anchor="middle" font-size="12" fill="#1e3a8a">Tailwind, React Router</text>
  <text x="350" y="268" text-anchor="middle" font-size="11" fill="#475569">Render static site</text>
  <line x1="270" y1="282" x2="430" y2="282" stroke="#93c5fd"/>
  <text x="350" y="302" text-anchor="middle" font-size="12" fill="#1e3a8a">Pages: Login, Groups,</text>
  <text x="350" y="318" text-anchor="middle" font-size="12" fill="#1e3a8a">Group dashboard, Profile</text>
  <text x="350" y="338" text-anchor="middle" font-size="12" fill="#1e3a8a">Components: Add expense,</text>
  <text x="350" y="354" text-anchor="middle" font-size="12" fill="#1e3a8a">Receipt, Notification bell</text>
  <text x="350" y="372" text-anchor="middle" font-size="11" fill="#475569">JWT kept in localStorage</text>

  <!-- Backend -->
  <rect x="530" y="150" width="200" height="270" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="630" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Backend API</text>
  <text x="630" y="196" text-anchor="middle" font-size="12" fill="#14532d">ASP.NET Core (.NET 10)</text>
  <text x="630" y="212" text-anchor="middle" font-size="11" fill="#475569">Render Docker web service</text>
  <line x1="550" y1="224" x2="710" y2="224" stroke="#86efac"/>
  <text x="630" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Controllers</text>
  <text x="630" y="260" text-anchor="middle" font-size="12" fill="#14532d">Auth · Groups · Expenses</text>
  <text x="630" y="276" text-anchor="middle" font-size="12" fill="#14532d">Settlements · Notifications</text>
  <text x="630" y="292" text-anchor="middle" font-size="12" fill="#14532d">Health</text>
  <line x1="550" y1="304" x2="710" y2="304" stroke="#86efac"/>
  <text x="630" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Services</text>
  <text x="630" y="340" text-anchor="middle" font-size="12" fill="#14532d">TokenService (JWT)</text>
  <text x="630" y="356" text-anchor="middle" font-size="12" fill="#14532d">NotificationService</text>
  <text x="630" y="372" text-anchor="middle" font-size="12" fill="#14532d">ReceiptStorage (DB-backed)</text>
  <text x="630" y="392" text-anchor="middle" font-size="11" fill="#475569">ASP.NET Identity + EF Core</text>
  <text x="630" y="408" text-anchor="middle" font-size="11" fill="#475569">Auto-migrates on startup</text>

  <!-- Database -->
  <g>
    <path d="M785,200 v150 a90,16 0 0 0 180,0 v-150" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
    <ellipse cx="875" cy="200" rx="90" ry="16" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
  </g>
  <text x="875" y="248" text-anchor="middle" font-size="16" font-weight="700" fill="#701a75">PostgreSQL</text>
  <text x="875" y="266" text-anchor="middle" font-size="11" fill="#475569">Render managed DB</text>
  <text x="875" y="288" text-anchor="middle" font-size="11" fill="#701a75">Users · Groups · Members</text>
  <text x="875" y="304" text-anchor="middle" font-size="11" fill="#701a75">Expenses · Shares</text>
  <text x="875" y="320" text-anchor="middle" font-size="11" fill="#701a75">Receipts · Settlements</text>
  <text x="875" y="336" text-anchor="middle" font-size="11" fill="#701a75">Notifications</text>

  <!-- Arrows -->
  <line x1="120" y1="310" x2="248" y2="285" stroke="#374151" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="184" y="283" text-anchor="middle" font-size="11" fill="#374151">HTTPS</text>
  <text x="184" y="332" text-anchor="middle" font-size="11" fill="#374151">uses app in browser</text>

  <line x1="452" y1="285" x2="528" y2="285" stroke="#374151" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="490" y="262" text-anchor="middle" font-size="11" fill="#374151">REST / JSON</text>
  <text x="490" y="276" text-anchor="middle" font-size="11" fill="#374151">/api/*</text>
  <text x="490" y="304" text-anchor="middle" font-size="10" fill="#374151">Bearer JWT</text>
  <text x="490" y="318" text-anchor="middle" font-size="10" fill="#374151">+ receipt upload</text>

  <line x1="732" y1="285" x2="783" y2="285" stroke="#374151" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="758" y="262" text-anchor="middle" font-size="11" fill="#374151">EF Core</text>
  <text x="758" y="304" text-anchor="middle" font-size="10" fill="#374151">SQL / SSL</text>
</svg>
