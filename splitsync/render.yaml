databases:
  - name: splitsync-db
    plan: free
    databaseName: splitsync
    user: splitsync

services:
  - type: web
    name: splitsync-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Default
        fromDatabase:
          name: splitsync-db
          property: connectionString
      - key: Jwt__Issuer
        value: SplitSync.Api
      - key: Jwt__Audience
        value: SplitSync.Client
      - key: Jwt__Key
        generateValue: true
      - key: Cors__AllowedOrigin
        value: https://splitsync-client.onrender.com

  - type: web
    name: splitsync-client
    runtime: static
    buildCommand: corepack enable && cd client && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://splitsync-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
